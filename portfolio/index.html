        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
        }

        /* Custom Scrollbar for both modes */
        ::-webkit-scrollbar { width: 8px; }
        .dark ::-webkit-scrollbar-track { background: #0f172a; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Reveal Animation Classes */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Gradient Text Utility */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #38bdf8, #818cf8);
        }

        /* Card Hover Effect Custom CSS */
        .glass-card {
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => { menu.classList.toggle('hidden'); });

        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('shadow-md');
                navbar.classList.replace('bg-white/80', 'bg-white/95');
                navbar.classList.replace('dark:bg-slate-900/80', 'dark:bg-slate-900/95');
            } else {
                navbar.classList.remove('shadow-md');
                navbar.classList.replace('bg-white/95', 'bg-white/80');
                navbar.classList.replace('dark:bg-slate-900/95', 'dark:bg-slate-900/80');
            }
        });

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });
        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));

        const themeToggleBtn = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;
        try {
            if (localStorage.theme === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
                htmlElement.classList.remove('dark');
            } else {
                htmlElement.classList.add('dark');
            }
        } catch (e) { htmlElement.classList.add('dark'); }
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            try { localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light'; } catch (e) {}
        });

    </script>
