name: 同步 Notion 文章

# 手動按鈕：GitHub 儲存庫 → Actions → 「同步 Notion 文章」→ Run workflow
on:
  workflow_dispatch:
    inputs:
      resync:
        description: "強制重新同步的文章 id（逗號分隔，例如 688,705,706），或填 all。一般請留空"
        required: false
        default: ""
      dry_run:
        description: "試跑：只檢查，不提交、不更新網站"
        type: boolean
        default: false
  # 之後想加每天自動同步，把下面兩行的 # 拿掉（時間是 UTC，0 1 * * * ＝ 台灣早上 9 點）
  # schedule:
  #   - cron: "0 1 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        # markdown-it-py 固定版本：不同版本產生的 HTML 可能有細微差異，會讓沒有新文章的執行也出現一堆變動
        run: pip install markdown-it-py==4.2.0 pillow

      - name: 從 Notion 同步
        id: sync
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RESYNC: ${{ inputs.resync }}
        run: python3 tools/sync_notion.py

      - name: 重建部落格
        run: python3 tools/build_blog.py

      - name: 試跑模式說明
        if: ${{ inputs.dry_run }}
        run: echo "### 試跑模式：以上結果沒有提交，網站沒有任何變動。" >> "$GITHUB_STEP_SUMMARY"

      - name: 提交並推送
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/posts.json blog
          if git diff --cached --quiet; then
            echo "沒有變動，不需要提交。"
            exit 0
          fi
          git commit -m "Sync Notion posts" -m "$(git diff --cached --shortstat)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: 要求 GitHub Pages 重新部署
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: 同步失敗時標示為失敗
        if: ${{ steps.sync.outcome == 'failure' }}
        run: |
          echo "同步步驟失敗，請看上面「從 Notion 同步」的日誌。"
          exit 1
